[package]
name = "spruceid-takehome"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "verifier"
path = "src/verifier.rs"

[[bin]]
name = "holder"
path = "src/holder.rs"

[lib]
name = "common"
path = "src/common.rs"

[dependencies]
axum = "0.8.6"
base64 = "0.22.1"
color-eyre = "0.6.5"
ed25519-dalek = { version = "3.0.0-pre.1", features = ["rand_core", "serde"] }
rand = "0.9.2"
reqwest = { version = "0.12.24", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["full"] }
